name: Integrate Hero Roster Controller Step 1

on:
  push:
    branches:
      - feature/alpha17-ending
    paths:
      - tools/integrate_hero_roster_controller_step1.py
      - .github/workflows/integrate-hero-roster-controller-step1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha17-ending
          fetch-depth: 0

      - name: Apply controller integration
        run: python tools/integrate_hero_roster_controller_step1.py

      - name: Validate generated source
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('scripts/main.gd').read_text(encoding='utf-8')
          assert text.count('HeroRosterControllerScript.open_picker_for(') == 1
          assert text.count('const HeroRosterControllerScript = preload(') == 1
          print('Roster controller integration validated.')
          PY

      - name: Commit generated changes
        run: |
          if git diff --quiet -- scripts/main.gd; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/main.gd
          git commit -m "refactor: delegate hero picker opening to roster controller"
          git push origin HEAD:feature/alpha17-ending
