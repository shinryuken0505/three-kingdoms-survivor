name: Alpha31 Portrait Relic Modal Hotfix

on:
  push:
    branches:
      - feature/alpha31-boss-telegraph-shapes
    paths:
      - tools/apply_alpha31_portrait_relic_modal_hotfix.py
      - .github/workflows/alpha31-portrait-relic-modal-hotfix.yml

permissions:
  contents: write

jobs:
  hotfix:
    if: ${{ !contains(github.event.head_commit.message, '[skip alpha31 portrait modal]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha31-boss-telegraph-shapes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply portrait and relic modal hotfix
        run: python tools/apply_alpha31_portrait_relic_modal_hotfix.py
      - name: Verify expected hotfix markers
        run: |
          grep -q 'V2.0.0-alpha.31-hotfix.1' scripts/main.gd
          grep -q 'func apply_alpha31_portrait_reference_hotfix' scripts/main.gd
          grep -q 'if not pending_relic_notice.is_empty()' scripts/main.gd
          grep -q 'zhangfei_default.png' scripts/main.gd
          grep -q 'caocao_default.png' scripts/main.gd
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/main.gd docs/art/alpha31_portrait_relic_modal_hotfix.md
          if git diff --cached --quiet; then
            echo "No hotfix changes to commit."
          else
            git commit -m "fix: correct hero portraits and pause relic notices [skip alpha31 portrait modal]"
            git push origin HEAD:feature/alpha31-boss-telegraph-shapes
          fi
