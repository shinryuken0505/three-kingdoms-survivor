name: Extract UI renderers

on:
  push:
    branches:
      - feature/alpha17-ending
    paths:
      - tools/extract_ui_renderers.py
      - scripts/ui/ending_ui.gd
      - scripts/ui/boss_loot_ui.gd
      - .github/workflows/extract-ui-renderers.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/alpha17-ending
          fetch-depth: 0

      - name: Apply extraction
        run: python tools/extract_ui_renderers.py

      - name: Commit extracted renderers
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/main.gd
          git commit -m "refactor: delegate ending and boss loot UI"
          git push origin feature/alpha17-ending
