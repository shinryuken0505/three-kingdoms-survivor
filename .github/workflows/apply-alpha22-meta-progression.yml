name: Apply Alpha.22 Meta Progression

on:
  push:
    branches:
      - feature/alpha22-meta-progression
    paths:
      - .github/workflows/apply-alpha22-meta-progression.yml
      - tools/apply_alpha22_meta_progression.py
      - scripts/systems/meta/alpha22_meta_progression.gd
      - scripts/systems/meta/alpha22_codex.gd
      - scripts/systems/meta/alpha22_achievements.gd
      - tests/alpha22_meta_progression_test.gd
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-alpha22-meta-progression
  cancel-in-progress: false

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Alpha.22 branch
        uses: actions/checkout@v4
        with:
          ref: feature/alpha22-meta-progression
          fetch-depth: 0

      - name: Install Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Apply Alpha.22 meta progression
        run: python tools/apply_alpha22_meta_progression.py

      - name: Validate Alpha.22 integration
        run: |
          python - <<'PY'
          from pathlib import Path
          main = Path('scripts/main.gd').read_text(encoding='utf-8')
          project = Path('project.godot').read_text(encoding='utf-8')
          assert 'V2.0.0-alpha.22' in main
          assert 'V2.0.0-alpha.22' in project
          assert 'Alpha22MetaProgression' in main
          assert 'func alpha22_record_run_result' in main
          assert 'func alpha22_purchase_upgrade' in main
          assert 'func alpha22_menu_entries' in main
          print('ALPHA22_INTEGRATION_OK')
          PY
          python tools/check_alpha17_integration.py
          python tools/check_navigation_architecture.py
          python tools/check_runtime_integration.py

      - name: Import and parse Godot project
        run: godot --headless --path . --editor --quit

      - name: Run Alpha.22 meta progression test
        run: godot --headless --path . --script res://tests/alpha22_meta_progression_test.gd

      - name: Run Alpha.21 regression test
        run: godot --headless --path . --script res://tests/alpha21_combat_identity_test.gd

      - name: Run Alpha.20 regression test
        run: godot --headless --path . --script res://tests/alpha20_demo_polish_test.gd

      - name: Run Alpha.19 regression test
        run: godot --headless --path . --script res://tests/alpha19_rules_test.gd

      - name: Run ending regression test
        run: godot --headless --path . --script res://tests/ending_manager_test.gd

      - name: Commit Alpha.22 runtime integration
        run: |
          git config user.name "chatgpt-agent"
          git config user.email "chatgpt-agent@users.noreply.github.com"
          git add scripts/main.gd project.godot
          if git diff --cached --quiet; then
            echo "No generated Alpha.22 changes to commit"
          else
            git commit -m "feat: integrate V2.0.0 Alpha.22 meta progression"
            git push origin feature/alpha22-meta-progression
          fi
