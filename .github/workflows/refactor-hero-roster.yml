name: Refactor hero roster

on:
  push:
    branches:
      - feature/alpha17-ending
    paths:
      - tools/refactor_hero_roster.py
      - .github/workflows/refactor-hero-roster.yml
      - scripts/systems/hero/hero_roster_manager.gd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/alpha17-ending
          fetch-depth: 0

      - name: Apply roster refactor
        run: python tools/refactor_hero_roster.py

      - name: Commit refactored main script
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/main.gd
          git commit -m "refactor: centralize hero roster logic"
          git push origin feature/alpha17-ending
