name: Integrate Hero Roster Controller

on:
  push:
    branches:
      - feature/alpha17-ending
    paths:
      - tools/integrate_hero_roster_controller.py
      - .github/workflows/integrate-hero-roster-controller.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha17-ending
          fetch-depth: 0

      - name: Apply controller integration
        run: python tools/integrate_hero_roster_controller.py

      - name: Commit generated changes
        run: |
          if git diff --quiet -- scripts/main.gd; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/main.gd
          git commit -m "refactor: delegate hero roster input decisions"
          git push origin HEAD:feature/alpha17-ending
