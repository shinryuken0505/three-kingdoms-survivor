name: Refine combat HUD

on:
  push:
    branches:
      - feature/alpha17-ending
    paths:
      - tools/refine_combat_hud.py
      - .github/workflows/refine-combat-hud.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-refinement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/alpha17-ending
          fetch-depth: 0

      - name: Apply HUD refinement
        run: python tools/refine_combat_hud.py

      - name: Commit refined HUD
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/main.gd
          git commit -m "feat: unify boss callouts and party HUD"
          git push origin feature/alpha17-ending
