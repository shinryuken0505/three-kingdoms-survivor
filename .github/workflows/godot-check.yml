name: Godot Check

on:
  push:
    branches:
      - master
      - develop
      - feature/**
      - fix/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Parse and self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize recoverable portrait files in CI workspace
        run: |
          python -m pip install --quiet pillow
          python tools/normalize_portrait_assets.py --write

      - name: Install Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Show Godot version
        run: godot --version

      - name: Import project and parse scripts
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee godot-import.log

      - name: Run project self-test
        shell: bash
        run: |
          set +e
          timeout 180s godot --headless --path . -- --self-test 2>&1 | tee godot-self-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            reason=$(grep 'DEMO6_SELF_TEST_FAIL' godot-self-test.log | tail -n 1)
            if [ -z "$reason" ]; then
              reason=$(grep 'Alpha.58 regression failure' godot-self-test.log | tail -n 6 | tr '\n' ' ')
            fi
            if [ -z "$reason" ]; then
              reason=$(grep -E 'SCRIPT ERROR|ERROR:' godot-self-test.log | tail -n 8 | tr '\n' ' ')
            fi
            if [ -z "$reason" ]; then
              reason="Godot self-test exited with status $status; inspect godot-self-test.log artifact."
            fi
            reason=$(printf '%s' "$reason" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Godot self-test failed::$reason"
            exit "$status"
          fi

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-check-logs
          path: |
            portrait-normalize-report.txt
            godot-import.log
            godot-self-test.log
          if-no-files-found: ignore
          retention-days: 7
