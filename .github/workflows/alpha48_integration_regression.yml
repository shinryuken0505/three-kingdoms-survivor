name: Alpha52 Player Signature Upgrades

on:
  push:
    branches:
      - feature/alpha52-player-signature-upgrades
  workflow_dispatch:

permissions:
  contents: write

jobs:
  player-signature-upgrades:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha52-player-signature-upgrades
          fetch-depth: 0

      - name: Apply Alpha52 migration
        run: python3 tools/alpha52_migrate.py

      - name: Static upgrade checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          project = Path('project.godot').read_text(encoding='utf-8')
          main = Path('scripts/main.gd').read_text(encoding='utf-8')
          upgrades = Path('scripts/systems/player/player_upgrade_service.gd').read_text(encoding='utf-8')
          passive = Path('scripts/systems/player/player_signature_passive_service.gd').read_text(encoding='utf-8')
          registry = Path('scripts/systems/player/player_archetype_registry.gd').read_text(encoding='utf-8')
          if 'V2.0.0-alpha.52' not in project or 'V2.0.0-alpha.52' not in main:
              raise SystemExit('Alpha.52 version not synchronized')
          for token in [
              'sig_blade_wave', 'sig_wide_arc', 'sig_blade_guard',
              'sig_eagle_eye', 'sig_split_arrow', 'sig_piercing_focus',
              'sig_orb_burst', 'sig_arcane_resonance', 'sig_frost_seal',
          ]:
              if token not in upgrades:
                  raise SystemExit('signature upgrade missing: ' + token)
          if 'install_signature_definitions' not in main:
              raise SystemExit('signature definitions not installed into skill pool')
          if 'return ["swordsman", "archer", "strategist"]' not in main:
              raise SystemExit('three protagonist selection order not active')
          if '戰術共鳴' not in main or 'PlayerUpgradeService.signature_summary' not in main:
              raise SystemExit('protagonist TAB information not connected')
          if 'LEGACY_ALIASES' not in registry:
              raise SystemExit('legacy protagonist aliases missing')
          for token in ['sig_blade_guard', 'eagle_eye_damage_multiplier', 'alpha52_burst_level']:
              if token not in passive:
                  raise SystemExit('signature passive integration missing: ' + token)
          for path, token in [
              ('scripts/systems/player/combat_handlers/melee_arc_handler.gd', 'sig_blade_wave'),
              ('scripts/systems/player/combat_handlers/ranged_arrow_handler.gd', 'sig_split_arrow'),
              ('scripts/systems/player/combat_handlers/strategy_orb_handler.gd', 'sig_arcane_resonance'),
          ]:
              if token not in Path(path).read_text(encoding='utf-8'):
                  raise SystemExit(path + ' missing ' + token)
          print('Alpha.52 static protagonist upgrade integration passed')
          PY

      - name: Commit synchronized runtime
        run: |
          if git diff --quiet; then
            echo "No runtime changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project.godot scripts/main.gd scripts/core/alpha48_runtime_coordinator.gd
          git commit -m "Alpha.52 connect protagonist signature upgrades"
          git push origin HEAD:feature/alpha52-player-signature-upgrades
