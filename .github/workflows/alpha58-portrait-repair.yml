name: Alpha58 Portrait Repair

on:
  push:
    branches:
      - feature/alpha58-stability-regression-guard

permissions:
  contents: write

jobs:
  repair:
    name: Normalize recoverable portraits
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Normalize recoverable portrait files
        run: |
          python -m pip install --quiet pillow
          python tools/normalize_portrait_assets.py --write

      - name: Commit repaired portrait bytes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portraits/*.png
          if git diff --cached --quiet; then
            echo "No recoverable portrait changes to commit."
            exit 0
          fi
          git commit -m "fix: normalize recoverable portrait assets [portrait-repair]"
          git push origin HEAD:${GITHUB_REF_NAME}
