name: Alpha58 Stability Repair

on:
  push:
    branches:
      - feature/alpha58-stability-regression-guard

permissions:
  contents: write

jobs:
  repair:
    name: Normalize portraits and apply guarded source repairs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Normalize recoverable portrait files
        run: |
          python -m pip install --quiet pillow
          python tools/normalize_portrait_assets.py --write

      - name: Align hero visual self-test contract
        run: python tools/alpha58_update_selftest_contract.py

      - name: Commit guarded repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portraits/*.png scripts/main.gd
          if git diff --cached --quiet; then
            echo "No Alpha.58 stabilization changes to commit."
            exit 0
          fi
          git commit -m "fix: apply Alpha58 stability repairs [stability-repair]"
          git push origin HEAD:${GITHUB_REF_NAME}
