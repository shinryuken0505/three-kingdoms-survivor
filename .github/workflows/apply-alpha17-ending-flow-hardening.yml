name: Apply Alpha.17 Ending Flow Hardening

on:
  push:
    branches:
      - feature/alpha17-ending
    paths:
      - .github/workflows/apply-alpha17-ending-flow-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-alpha17-ending-flow-hardening
  cancel-in-progress: false

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/alpha17-ending
          fetch-depth: 0

      - name: Install Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Apply complete ending flow patch
        run: python tools/apply_alpha17_ending_flow_hardening.py

      - name: Run structural checks
        run: |
          python tools/check_ending_flow_hardening.py
          python tools/check_alpha17_integration.py
          python tools/check_navigation_architecture.py
          python tools/check_runtime_integration.py

      - name: Import and parse Godot project
        run: godot --headless --path . --editor --quit

      - name: Run ending manager test
        run: godot --headless --path . --script res://tests/ending_manager_test.gd

      - name: Run Alpha.17 integration smoke test
        run: godot --headless --path . --script res://tests/alpha17_integration_smoke_test.gd

      - name: Commit hardened ending flow
        run: |
          git config user.name "chatgpt-agent"
          git config user.email "chatgpt-agent@users.noreply.github.com"
          git add scripts/main.gd scripts/chapter_manager.gd scripts/systems/ending/ending_manager.gd scripts/ui/ending_ui.gd tests/alpha17_integration_smoke_test.gd tests/ending_manager_test.gd tools/check_ending_flow_hardening.py tools/apply_alpha17_ending_flow_hardening.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: harden final loot and ending flow"
            git push origin feature/alpha17-ending
          fi

