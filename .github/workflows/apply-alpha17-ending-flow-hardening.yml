name: Apply Alpha.17 Ending Flow Hardening

on:
  push:
    branches:
      - feature/alpha17-ending
    paths:
      - .github/workflows/apply-alpha17-ending-flow-hardening.yml
  pull_request:
    branches:
      - feature/alpha17-ending
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-alpha17-ending-flow-hardening
  cancel-in-progress: false

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/alpha17-ending
          fetch-depth: 0

      - name: Install Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Apply ending flow patch when needed
        run: |
          if grep -q 'const SNAPSHOT_VERSION: int = 2' scripts/systems/ending/ending_manager.gd \
             && grep -q 'func can_finalize_campaign()' scripts/chapter_manager.gd \
             && grep -q 'func draw_ending()' scripts/main.gd; then
            echo "Ending flow hardening already applied"
          else
            python tools/apply_alpha17_ending_flow_hardening.py
          fi

      - name: Align intermission contract and smoke test
        run: |
          python - <<'PY'
          from pathlib import Path

          input_path = Path('scripts/ui/screens/intermission_input_controller.gd')
          input_text = input_path.read_text(encoding='utf-8')
          input_text = input_text.replace(
              'return StringName(button.get("id", &""))',
              'return StringName(button.get("id", button.get("key", &"")))'
          )
          input_path.write_text(input_text, encoding='utf-8')

          path = Path('tests/alpha17_integration_smoke_test.gd')
          text = path.read_text(encoding='utf-8')
          text = text.replace('ScreenRouteRegistry.missing_screen_ids()', 'ScreenRouteRegistry.validate()')
          text = text.replace('ScreenRouteRegistry.route(ScreenIds.INTERMISSION)', 'ScreenRouteRegistry.get_route(ScreenIds.INTERMISSION)')
          text = text.replace('var missing: Array[StringName] = ScreenRouteRegistry.validate()', 'var missing: Array[String] = ScreenRouteRegistry.validate()')
          text = text.replace('intermission.get("draw", "")', 'intermission.get(ScreenRouteRegistry.DRAW_METHOD, "")')
          text = text.replace('intermission.get("input", "")', 'intermission.get(ScreenRouteRegistry.INPUT_METHOD, "")')
          text = text.replace(
              'var model: Dictionary = IntermissionScreenModel.build({\n\t\t"view_size": Vector2(1280.0, 720.0),',
              'var model: Dictionary = IntermissionScreenModel.build({'
          )
          text = text.replace(
              '\t\t"history": ["史勢演變"],\n\t})\n\tvar buttons: Array = model.get("buttons", []) as Array',
              '\t\t"history": ["史勢演變"],\n\t}, 1, Vector2(1280.0, 720.0))\n\tvar buttons: Array = model.get("actions", []) as Array'
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run structural checks
        run: |
          python tools/check_ending_flow_hardening.py
          python tools/check_alpha17_integration.py
          python tools/check_navigation_architecture.py
          python tools/check_runtime_integration.py

      - name: Import and parse Godot project
        run: godot --headless --path . --editor --quit

      - name: Run ending manager test
        run: godot --headless --path . --script res://tests/ending_manager_test.gd

      - name: Run Alpha.17 integration smoke test
        run: godot --headless --path . --script res://tests/alpha17_integration_smoke_test.gd

      - name: Commit any final alignment
        run: |
          git config user.name "chatgpt-agent"
          git config user.email "chatgpt-agent@users.noreply.github.com"
          git add scripts/main.gd scripts/chapter_manager.gd scripts/systems/ending/ending_manager.gd scripts/ui/ending_ui.gd scripts/ui/screens/intermission_input_controller.gd tests/alpha17_integration_smoke_test.gd tests/ending_manager_test.gd tools/check_ending_flow_hardening.py tools/apply_alpha17_ending_flow_hardening.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: align ending flow integration contracts"
            git push origin feature/alpha17-ending
          fi

# retrigger: idempotent final validation
