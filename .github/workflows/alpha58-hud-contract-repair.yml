name: Alpha58 HUD Contract Repair

on:
  push:
    branches:
      - feature/alpha58-stability-regression-guard

permissions:
  contents: write

jobs:
  repair:
    name: Remove stale nested HUD overlap assertion
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch HUD contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/main.gd')
          text = path.read_text(encoding='utf-8')
          old_const = 'const HUD_PLAYER_RECT: Rect2 = Rect2(84.0, 630.0, 202.0, 66.0)\n'
          if old_const in text:
              text = text.replace(old_const, '', 1)
          old_check = '''\tif (\n\t\tHUD_RELIC_RECT.intersects(HUD_HEADER_RECT)\n\t\tor HUD_HEADER_RECT.intersects(HUD_MINIMAP_RECT)\n\t\tor HUD_PLAYER_RECT.intersects(HUD_HERO_RAIL_RECT)\n\t):\n'''
          new_check = '''\tif (\n\t\tHUD_RELIC_RECT.intersects(HUD_HEADER_RECT)\n\t\tor HUD_HEADER_RECT.intersects(HUD_MINIMAP_RECT)\n\t):\n'''
          if old_check in text:
              text = text.replace(old_check, new_check, 1)
          elif new_check not in text:
              raise SystemExit('Expected HUD self-test block not found; refusing broad edit.')
          path.write_text(text, encoding='utf-8')
          print('Aligned Alpha.58 HUD safe-area self-test with nested hero rail layout.')
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/main.gd
          if git diff --cached --quiet; then
            echo "No source change to commit."
            exit 0
          fi
          git commit -m "test: align HUD safe-area contract with hero rail"
          git push origin HEAD:${GITHUB_REF_NAME}
