name: Fix Replace Modal Layout

on:
  push:
    branches: [feature/alpha17-ending]
    paths:
      - 'tools/fix_replace_modal_layout.py'
      - '.github/workflows/fix-replace-modal-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha17-ending
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/fix_replace_modal_layout.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/main.gd
          git diff --cached --quiet || git commit -m "fix: center hero replacement modals"
          git push
