name: Alpha28 Relic Flow Polish

on:
  workflow_dispatch:
  push:
    branches: [feature/alpha28-relic-flow-polish]
    paths:
      - tools/apply_alpha28_relic_flow.py
      - .github/workflows/alpha28-relic-flow-polish.yml

permissions:
  contents: write

jobs:
  apply-alpha28:
    if: ${{ !contains(github.event.head_commit.message, '[skip alpha28]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha28-relic-flow-polish
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Alpha.28 relic flow patch
        run: python tools/apply_alpha28_relic_flow.py
      - name: Commit Alpha.28 gameplay changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/main.gd docs/art/alpha28_relic_flow_report.md
          if git diff --cached --quiet; then
            echo "No Alpha.28 changes to commit."
          else
            git commit -m "fix: stabilize relic acquisition and upgrade validation [skip alpha28]"
            git push origin HEAD:feature/alpha28-relic-flow-polish
          fi