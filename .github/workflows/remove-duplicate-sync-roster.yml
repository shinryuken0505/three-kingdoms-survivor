name: Remove Duplicate Roster Sync

on:
  push:
    branches:
      - feature/alpha17-ending
    paths:
      - tools/remove_duplicate_sync_roster.py
      - .github/workflows/remove-duplicate-sync-roster.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha17-ending
          fetch-depth: 0

      - name: Remove duplicate function
        run: python tools/remove_duplicate_sync_roster.py

      - name: Commit cleanup
        run: |
          if git diff --quiet -- scripts/main.gd; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/main.gd
          git commit -m "fix: remove duplicate roster sync function"
          git push origin HEAD:feature/alpha17-ending
