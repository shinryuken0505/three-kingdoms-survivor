name: Fix Alpha30 Relic Notice Scope

on:
  push:
    branches:
      - feature/alpha30-boss-telegraph-effects
    paths:
      - tools/fix_alpha30_relic_notice_scope.py
      - .github/workflows/fix-alpha30-relic-notice-scope.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha30-boss-telegraph-effects
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair relic notice variable scope
        run: python tools/fix_alpha30_relic_notice_scope.py
      - name: Commit scope fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/main.gd
          git diff --cached --quiet || git commit -m "fix: repair relic notice self-test scope [skip alpha30 scope]"
          git push
