name: Architecture Guard

on:
  push:
    branches:
      - feature/alpha17-ending
    paths:
      - "scripts/**"
      - "tests/**"
      - "localization/**"
      - "tools/architecture_guard.py"
      - "tools/check_localization_keys.py"
      - "tools/check_status_effects.py"
      - "tools/check_navigation_architecture.py"
      - "tools/check_alpha17_integration.py"
      - "tools/check_runtime_integration.py"
      - "tools/check_upgrade_pool_architecture.py"
      - "tools/check_levelup_pool_integration.py"
      - "tools/check_alpha18_upgrade_paths.py"
      - "tools/check_alpha18_hero_recruitment.py"
      - "tools/check_alpha18_intermission_recruitment.py"
      - "tools/check_alpha18_player_facing_metadata.py"
      - "tools/check_alpha18_specialization_offers.py"
      - "tools/check_alpha18_levelup_layout.py"
      - "tools/check_alpha18_release_contract.py"
      - ".github/workflows/architecture-guard.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "localization/**"
      - "tools/architecture_guard.py"
      - "tools/check_localization_keys.py"
      - "tools/check_status_effects.py"
      - "tools/check_navigation_architecture.py"
      - "tools/check_alpha17_integration.py"
      - "tools/check_runtime_integration.py"
      - "tools/check_upgrade_pool_architecture.py"
      - "tools/check_levelup_pool_integration.py"
      - "tools/check_alpha18_upgrade_paths.py"
      - "tools/check_alpha18_hero_recruitment.py"
      - "tools/check_alpha18_intermission_recruitment.py"
      - "tools/check_alpha18_player_facing_metadata.py"
      - "tools/check_alpha18_specialization_offers.py"
      - "tools/check_alpha18_levelup_layout.py"
      - "tools/check_alpha18_release_contract.py"
      - ".github/workflows/architecture-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check architecture invariants
        run: python tools/architecture_guard.py
      - name: Check localization catalogs
        run: python tools/check_localization_keys.py
      - name: Check status effect consistency
        run: python tools/check_status_effects.py
      - name: Check navigation architecture
        run: python tools/check_navigation_architecture.py
      - name: Check Alpha.17 integration readiness
        run: python tools/check_alpha17_integration.py
      - name: Check runtime integration wiring
        run: python tools/check_runtime_integration.py
      - name: Check upgrade pool architecture
        run: python tools/check_upgrade_pool_architecture.py
      - name: Check level-up pool integration
        run: python tools/check_levelup_pool_integration.py
      - name: Check Alpha.18 identity upgrade paths
        run: python tools/check_alpha18_upgrade_paths.py
      - name: Check Alpha.18 hero ability and recruitment
        run: python tools/check_alpha18_hero_recruitment.py
      - name: Check Alpha.18 intermission and recruitment UI
        run: python tools/check_alpha18_intermission_recruitment.py
      - name: Check Alpha.18 player-facing metadata
        run: python tools/check_alpha18_player_facing_metadata.py
      - name: Check Alpha.18 specialization offers
        run: python tools/check_alpha18_specialization_offers.py
      - name: Check Alpha.18 level-up layout
        run: python tools/check_alpha18_levelup_layout.py
      - name: Check Alpha.18 release contract
        run: python tools/check_alpha18_release_contract.py
