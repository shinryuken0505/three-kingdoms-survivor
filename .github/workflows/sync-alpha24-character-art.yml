name: Sync Alpha24 Character Art

on:
  workflow_dispatch:
  push:
    branches: [feature/alpha24-steam-demo]
    paths:
      - tools/sync_alpha24_character_art.py
      - .github/workflows/sync-alpha24-character-art.yml

permissions:
  contents: write

jobs:
  sync-art:
    if: ${{ !contains(github.event.head_commit.message, '[skip art sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha24-steam-demo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - run: python tools/sync_alpha24_character_art.py
      - name: Commit optimized portraits and pixel sprites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portraits assets/sprites docs/art/alpha24_portrait_pixel_todo.md
          if git diff --cached --quiet; then
            echo "No art changes to commit."
          else
            git commit -m "art: sync premium portraits and pixel identities [skip art sync]"
            git push origin HEAD:feature/alpha24-steam-demo
          fi
