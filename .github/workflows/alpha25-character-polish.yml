name: Alpha25 Character Polish

on:
  workflow_dispatch:
  push:
    branches: [feature/alpha25-character-polish]
    paths:
      - tools/apply_alpha25_character_polish.py
      - .github/workflows/alpha25-character-polish.yml

permissions:
  contents: write

jobs:
  character-polish:
    if: ${{ !contains(github.event.head_commit.message, '[skip alpha25 polish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha25-character-polish
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Apply Alpha.25 character polish
        run: python tools/apply_alpha25_character_polish.py
      - name: Commit Alpha.25 runtime and art changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/main.gd assets/sprites docs/art/alpha25_character_polish_report.md
          if git diff --cached --quiet; then
            echo "No Alpha.25 changes to commit."
          else
            git commit -m "feat: polish Alpha.25 character identities and camp test [skip alpha25 polish]"
            git push origin HEAD:feature/alpha25-character-polish
          fi
