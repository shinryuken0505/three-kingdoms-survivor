name: Alpha57 Build Aware Recruitment

on:
  push:
    branches:
      - feature/alpha57-build-aware-recruitment-ui
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aware-recruitment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha57-build-aware-recruitment-ui
          fetch-depth: 0

      - name: Apply Alpha57 migration
        run: python3 tools/alpha57_migrate.py

      - name: Static recruitment checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          project = Path('project.godot').read_text(encoding='utf-8')
          main = Path('scripts/main.gd').read_text(encoding='utf-8')
          coordinator = Path('scripts/core/alpha48_runtime_coordinator.gd').read_text(encoding='utf-8')
          game_data = Path('scripts/game_data.gd').read_text(encoding='utf-8')
          registry = Path('scripts/systems/hero/hero_content_registry.gd').read_text(encoding='utf-8')
          service = Path('scripts/systems/hero/hero_recruitment_affinity_service.gd').read_text(encoding='utf-8')
          for text, label in [(project,'project'), (main,'main'), (coordinator,'coordinator')]:
              if 'V2.0.0-alpha.57' not in text:
                  raise SystemExit(label + ' version not synchronized')
          for token in ['"zhangjiao"', 'zhangjiao_default.png', '太平雷法']:
              if token not in game_data:
                  raise SystemExit('GameData Zhang Jiao incomplete: ' + token)
          for token in ['"zhangjiao": {', '"element":"lightning"', '"status_tags":["shock"]', '"zhang_jiao":"zhangjiao"']:
              if token not in registry:
                  raise SystemExit('HeroContentRegistry Zhang Jiao incomplete: ' + token)
          for token in ['adjusted_weight', 'affinity_hint', 'element_label', 'current_build_tags']:
              if token not in service:
                  raise SystemExit('recruitment affinity service missing: ' + token)
          for token in ['HeroRecruitmentAffinityService.adjusted_weight', 'HeroRecruitmentAffinityService.affinity_hint', 'HeroRecruitmentAffinityService.element_label']:
              if token not in main:
                  raise SystemExit('main recruitment integration missing: ' + token)
          if '與目前戰術搭配良好' not in service:
              raise SystemExit('natural affinity hint missing')
          print('Alpha.57 static build-aware recruitment integration passed')
          PY

      - name: Commit synchronized runtime
        run: |
          if git diff --quiet; then
            echo "No runtime changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project.godot scripts/main.gd scripts/game_data.gd scripts/core/alpha48_runtime_coordinator.gd scripts/systems/hero/hero_content_registry.gd
          git commit -m "Alpha.57 connect build-aware recruitment"
          git push origin HEAD:feature/alpha57-build-aware-recruitment-ui
