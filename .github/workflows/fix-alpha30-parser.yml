name: Fix Alpha30 Parser

on:
  push:
    branches: [feature/alpha30-boss-telegraph-effects]
    paths:
      - tools/fix_alpha30_process_indent.py
      - .github/workflows/fix-alpha30-parser.yml

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip alpha30 fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha30-boss-telegraph-effects
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair Alpha.30 parser indentation
        run: python tools/fix_alpha30_process_indent.py
      - name: Commit parser fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/main.gd
          if git diff --cached --quiet; then
            echo "No parser repair needed."
          else
            git commit -m "fix: repair Alpha.30 boss intro indentation [skip alpha30 fix]"
            git push origin HEAD:feature/alpha30-boss-telegraph-effects
          fi
