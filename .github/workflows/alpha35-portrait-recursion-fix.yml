name: Alpha35 Portrait Recursion Fix

on:
  push:
    branches:
      - feature/alpha35-boss-phase-enrage
    paths:
      - tools/fix_alpha35_portrait_recursion.py
      - .github/workflows/alpha35-portrait-recursion-fix.yml

permissions:
  contents: write

jobs:
  fix-alpha35-portrait:
    if: ${{ !contains(github.event.head_commit.message, '[skip alpha35 portrait fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha35-boss-phase-enrage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair portrait recursion
        run: python tools/fix_alpha35_portrait_recursion.py
      - name: Verify recursion removed
        run: |
          grep -q 'portrait_tex\[hero_id\] is Texture2D' scripts/main.gd
          ! grep -q 'hero_portrait(str(hero_id)) is Texture2D' scripts/main.gd
      - name: Commit portrait recursion fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/main.gd
          if git diff --cached --quiet; then
            echo "No portrait recursion changes."
          else
            git commit -m "fix: remove Alpha.35 portrait resolver recursion [skip alpha35 portrait fix]"
            git push origin HEAD:feature/alpha35-boss-phase-enrage
          fi
