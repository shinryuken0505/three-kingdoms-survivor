name: Apply Status HUD Patch

on:
  push:
    branches:
      - feature/alpha17-ending
    paths:
      - "tools/apply_status_hud_patch.py"
      - ".github/workflows/apply-status-hud-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha17-ending
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply guarded patch
        run: python tools/apply_status_hud_patch.py
      - name: Run architecture checks
        run: |
          python tools/architecture_guard.py
          python tools/check_localization_keys.py
      - name: Commit integration and remove one-time patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply_status_hud_patch.py .github/workflows/apply-status-hud-patch.yml
          git add scripts/main.gd
          git commit -m "feat: show player status effects in battle HUD"
          git push origin HEAD:feature/alpha17-ending
