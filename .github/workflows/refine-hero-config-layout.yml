name: Refine Hero Config Layout

on:
  push:
    branches:
      - feature/alpha17-ending
    paths:
      - tools/refine_hero_config_layout.py
      - .github/workflows/refine-hero-config-layout.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha17-ending
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hero config layout patch
        run: python tools/refine_hero_config_layout.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/main.gd
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: separate active and reserve hero layout"
            git push origin HEAD:feature/alpha17-ending
          fi
