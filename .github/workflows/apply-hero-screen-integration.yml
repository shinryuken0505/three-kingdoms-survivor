name: Apply Hero Screen Integration

on:
  push:
    branches:
      - feature/alpha17-ending
    paths:
      - ".github/workflows/apply-hero-screen-integration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha17-ending
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Integrate hero screen modules
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/main.gd")
          text = path.read_text(encoding="utf-8")

          preload_anchor = 'const HeroRosterControllerScript = preload("res://scripts/systems/hero/hero_roster_controller.gd")\n'
          preload_insert = preload_anchor + (
              'const HeroConfigScreenScript = preload("res://scripts/ui/screens/hero_config_screen.gd")\n'
              'const HeroPositionPickerScreenScript = preload("res://scripts/ui/screens/hero_position_picker_screen.gd")\n'
              'const HeroReplaceScreenScript = preload("res://scripts/ui/screens/hero_replace_screen.gd")\n'
          )
          if text.count(preload_anchor) != 1:
              raise SystemExit(f"preload anchor count must be 1, got {text.count(preload_anchor)}")
          if 'HeroConfigScreenScript = preload' not in text:
              text = text.replace(preload_anchor, preload_insert, 1)

          old_rows = '''\tvar visible_count: int = 5
\tvar start: int = clampi(hero_config_index - int(visible_count / 2), 0, max(0, order.size() - visible_count))
\tvar finish: int = min(order.size(), start + visible_count)
'''
          new_rows = '''\tvar visible_count: int = 5
\tvar visible_window: Dictionary = HeroConfigScreenScript.visible_rows(
\t\torder.size(), hero_config_index, visible_count
\t)
\tvar start: int = int(visible_window.get("start", 0))
\tvar finish: int = int(visible_window.get("end", order.size()))
'''
          if old_rows in text:
              if text.count(old_rows) != 1:
                  raise SystemExit(f"hero row block count must be 1, got {text.count(old_rows)}")
              text = text.replace(old_rows, new_rows, 1)
          elif new_rows not in text:
              raise SystemExit("hero row integration anchor not found")

          old_picker_index = '''\thero_position_index = clampi(hero_position_index, 0, 3)
'''
          new_picker_index = '''\thero_position_index = HeroPositionPickerScreenScript.normalized_index(hero_position_index)
'''
          if old_picker_index in text:
              if text.count(old_picker_index) != 1:
                  raise SystemExit(f"picker clamp count must be 1, got {text.count(old_picker_index)}")
              text = text.replace(old_picker_index, new_picker_index, 1)

          path.write_text(text, encoding="utf-8")

          # Hard validation: each integration symbol must occur and no duplicate function was introduced.
          required = [
              "HeroConfigScreenScript.visible_rows",
              "HeroPositionPickerScreenScript",
              "HeroReplaceScreenScript",
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f"missing integration token: {token}")
          PY
      - name: Run guards
        run: |
          python tools/architecture_guard.py
          python tools/check_localization_keys.py
      - name: Commit integration and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-hero-screen-integration.yml
          git add scripts/main.gd
          git diff --cached --check
          git commit -m "refactor: integrate hero screen modules into main"
          git push origin HEAD:feature/alpha17-ending
